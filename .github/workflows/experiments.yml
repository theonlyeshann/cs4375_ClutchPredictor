name: Reproducible experiments
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m experiments.audit --output results/ci-audit
      - run: python -m experiments.reproduce --output results/ci-legacy
      - run: python -m experiments.evaluate --output results/ci-temporal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-evidence
          path: results/ci-*
          retention-days: 14
